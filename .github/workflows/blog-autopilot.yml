name: Blog autopilot

# ══════════════════════════════════════════════════════════════════════════
# ⏸  PUBBLICAZIONE AUTOMATICA SOSPESA — 18 agosto 2026, su richiesta di Luca.
#
# Nessun articolo deve uscire questa settimana. Lo `schedule` qui sotto è
# commentato: il workflow resta eseguibile SOLO a mano (workflow_dispatch),
# così una pubblicazione volontaria è ancora possibile ma nessuna parte da sola.
#
# PER RIPRENDERE: togli il commento alle due righe `schedule:` / `- cron:`.
# Il bot riparte dal primo mercoledì utile e pesca la prima riga di
# schedule.json con `blog_pubblicato` vuoto — la coda non si è persa, si è
# solo fermata. Non serve nient'altro.
# ══════════════════════════════════════════════════════════════════════════
#
# Sul perché l'orario è 03:40 e non 04:00 (vale quando si riattiva):
# GitHub Actions cron è SOLO UTC, non timezone-aware, ed è best-effort:
# i job schedulati al minuto :00 cadono nella massima congestione e GitHub
# li ritarda di ore o li scarta. Usiamo un minuto NON tondo e anticipiamo
# a 03:40 UTC per assorbire il ritardo tipico restando vicini al target.
# 03:40 UTC corrisponde a:
#   - 05:40 CEST (estate Italia) ← target principale
#   - 04:40 CET  (inverno Italia)
# Anche con ritardo GitHub l'articolo esce in mattinata italiana.
on:
  # schedule:
  #   - cron: "40 3 * * 3"   # Mercoledì 03:40 UTC (= 05:40 CEST / 04:40 CET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (genera ma non pubblica)"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # serve permesso di push su main per committare l'articolo
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tools/blog-bot
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN ha permission contents:write, ma usiamo PAT per push
          # automatici che attraversano branch protection o per non triggerare
          # actions ricorsive.
          token: ${{ secrets.GH_PAT_BLOG_PUSH || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Run blog autopilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npx tsx generate-article.ts --dry-run
          else
            npx tsx generate-article.ts
          fi
