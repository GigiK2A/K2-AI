name: Blog autopilot

# Esegue ogni giovedì alle 06:00 CET (05:00 UTC in inverno, 04:00 in estate).
# 5 UTC = 06:00 in inverno (CET) / 07:00 in estate (CEST).
# Per restare sempre 06-07 CET locale, usiamo 05 UTC. Workflow ammette anche
# manual dispatch per generare on-demand.
on:
  schedule:
    - cron: "0 5 * * 4"   # Giovedì 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (genera ma non pubblica)"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # serve permesso di push su main per committare l'articolo
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tools/blog-bot
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN ha permission contents:write, ma usiamo PAT per push
          # automatici che attraversano branch protection o per non triggerare
          # actions ricorsive.
          token: ${{ secrets.GH_PAT_BLOG_PUSH || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/blog-bot/package-lock.json

      - name: Install deps
        run: npm install

      - name: Run blog autopilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npx tsx generate-article.ts --dry-run
          else
            npx tsx generate-article.ts
          fi
