name: Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to redeploy"
        required: true
        type: choice
        default: both
        options:
          - kai-website
          - k2-board
          - k2-aios
          - both

# Railway "GitHub integration" auto-deploys both services on push to main
# whenever files inside their watched Root Directory change. This workflow is
# the manual escape hatch — useful when a deploy needs to be re-triggered
# without a new commit (e.g. env-var change) or when GitHub integration is
# temporarily disabled.
#
# Setup once:
#   1. Railway dashboard → Project → Settings → Tokens → "GitHub Actions"
#      Create token, copy.
#   2. GitHub repo → Settings → Secrets → Actions → New repository secret:
#        RAILWAY_TOKEN_KAI_WEBSITE  = <token of kai-website service>
#        RAILWAY_TOKEN_K2_BOARD     = <token of k2-board service>
#        RAILWAY_TOKEN_K2_AIOS      = <token of k2-aios service>  (root dir = aios)
#
# Then: gh workflow run Deploy --field service=both   (o --field service=k2-aios)

jobs:
  deploy-kai-website:
    if: ${{ github.event.inputs.service == 'kai-website' || github.event.inputs.service == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Redeploy kai-website
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_KAI_WEBSITE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing RAILWAY_TOKEN_KAI_WEBSITE repository secret"; exit 1
          fi
          cd kai-website
          railway redeploy --yes

  deploy-k2-board:
    if: ${{ github.event.inputs.service == 'k2-board' || github.event.inputs.service == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Redeploy k2-board
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_K2_BOARD }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing RAILWAY_TOKEN_K2_BOARD repository secret"; exit 1
          fi
          cd apps/board
          railway redeploy --yes

  deploy-k2-aios:
    if: ${{ github.event.inputs.service == 'k2-aios' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Redeploy k2-aios
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_K2_AIOS }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing RAILWAY_TOKEN_K2_AIOS repository secret"; exit 1
          fi
          cd aios
          railway redeploy --yes
