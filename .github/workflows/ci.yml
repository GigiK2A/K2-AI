name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  website-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kai-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kai-website/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build website
        run: npm run build

  board-sanity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-board
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: uv sync --frozen
      - name: Compile check
        run: uv run python -m py_compile main.py core/config.py core/notion_board.py interfaces/dashboard/routes/public_intake.py
