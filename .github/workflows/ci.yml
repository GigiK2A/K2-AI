name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
  schedule:
    # GitHub usa UTC: 18/19 UTC coprono le 20:00 Europe/Rome con cambio ora.
    - cron: "0 18,19 * * *"

jobs:
  rome-time-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(TZ=Europe/Rome date +%H)" = "20" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  website-build:
    needs: rome-time-gate
    if: needs.rome-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kai-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kai-website/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build website
        run: npm run build

  kbot-build:
    needs: rome-time-gate
    if: needs.rome-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kai-website/kbot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kai-website/kbot/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint kbot
        run: npm run lint
      - name: Build kbot
        run: npm run build

  board-sanity:
    needs: rome-time-gate
    if: needs.rome-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-board
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: uv sync --frozen
      - name: Compile check
        run: uv run python -m py_compile main.py core/config.py core/notion_board.py interfaces/dashboard/routes/public_intake.py

  k2-aios-test:
    needs: rome-time-gate
    if: needs.rome-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/board
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Test suite (hermetic, no secrets needed)
        run: python -m pytest -q

  # Il backend FastAPI del K-BOT era FUORI dalla CI (kbot-build compila solo il
  # frontend Next.js) → 6 test stale erano passati inosservati. La suite pytest è
  # ERMETICA (conftest setta env dummy, nessun segreto reale) e gira in ~30s.
  kbot-backend-test:
    needs: rome-time-gate
    if: needs.rome-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kai-website/kbot/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt && pip install pytest
      - name: Test suite (hermetic, no secrets needed)
        run: python -m pytest -q
