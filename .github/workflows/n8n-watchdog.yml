name: n8n watchdog (board)

# Sveglia il watchdog del board lun/mer/ven alle 21:00 ora di Roma.
# GitHub Actions gira in UTC: Roma è UTC+2 d'estate (CEST) e UTC+1 d'inverno (CET),
# quindi schediamo a 19:00 e 20:00 UTC e poi teniamo solo l'esecuzione in cui a Roma
# sono davvero le 21. Il board fa tutto il lavoro; qui c'è solo la sveglia.
on:
  schedule:
    - cron: "0 19 * * 1,3,5"   # 21:00 Roma quando è CEST (estate)
    - cron: "0 20 * * 1,3,5"   # 21:00 Roma quando è CET (inverno)
  workflow_dispatch: {}         # esecuzione manuale dalla tab Actions

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica che a Roma siano le 21 (salta l'orario doppione)
        id: gate
        run: |
          H=$(TZ='Europe/Rome' date +%H)
          echo "Ora a Roma: ${H}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "21" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Chiama il watchdog del board
        if: steps.gate.outputs.run == 'yes'
        env:
          TOKEN: ${{ secrets.AIOS_API_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/wd.json -w "%{http_code}" -X POST \
            https://api.k2-ai.it/api/n8n/watchdog \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" --max-time 120)
          echo "HTTP ${code}"
          cat /tmp/wd.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::watchdog HTTP ${code}"; exit 1
          fi
