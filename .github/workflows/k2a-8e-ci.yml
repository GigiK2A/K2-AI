name: k2a-8e CI

# Valida il motore 8e: smoke test + resolve/L1 su tutti i boost + schema catalog.
# NON deploya (il deploy lo fa Luigi manualmente).
on:
  push:
    paths:
      - 'kai-website/k2a-8e/**'
  pull_request:
    paths:
      - 'kai-website/k2a-8e/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kai-website/k2a-8e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Smoke test (offline, LegalBoost end-to-end)
        run: python tests/smoke_test.py
      - name: Resolve + L1 su tutti gli 11 boost
        run: python tests/test_all_boosts.py
      - name: Security suite
        run: K2A_ENTITLEMENT_SECRET=ci-secret-32bytes-minimum-length! python tests/security_test.py
      - name: Render premium su tutti i 12 schemi
        run: pip install pdfplumber >/dev/null 2>&1; python tests/test_render_all.py
      - name: Generazione profonda per-sezione (client Anthropic mock, no crediti)
        run: python tests/test_deep_mock.py
      - name: Clamp avversariale su tutti i 12 schemi (pattern/minItems/enum/const/num)
        run: python tests/test_clamp_adversarial.py
      - name: Freshness-gate snapshot (testo normativo non stale vs leggi note)
        run: python tests/test_freshness_gate.py
      - name: Coverage snapshot (no placeholder normativo irrisolto)
        run: |
          python - <<'PY'
          import json
          d = json.load(open('grounding/grounding-snapshot.json'))
          cov = d['coverage']
          # ammessi solo gap di tipo benchmark (da_strutturare)
          bad = [g for g in cov['gaps'] if g.get('tipo') != 'benchmark']
          assert not bad, f"placeholder non-benchmark irrisolti: {bad}"
          print(f"coverage OK: {cov['resolved']}/{cov['declared']} (gap solo benchmark)")
          PY
