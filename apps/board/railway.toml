# Single-service Railway deploy for K2-Board (Next.js + FastAPI in one container).
# Set Railway service "Root Directory" to `apps/board`; the Dockerfile lives here.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
