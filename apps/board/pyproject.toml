[project]
name = "aios"
version = "0.0.1"
description = "K2-AI AIOS kernel core"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.1", "anthropic>=0.40", "fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." serve per i runner nella root del board (autonomy_loop, scheduler, serve_cockpit):
# senza, il loop di autonomia non era importabile dai test e restava senza copertura.
pythonpath = ["src", "."]
