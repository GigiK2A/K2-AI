[build]
builder = "NIXPACKS"

[build.nixpacksConfig]
phases.setup.aptPkgs = [
    "chromium",
    "ca-certificates",
    "fonts-liberation",
    "libnss3",
]

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
