[build]
builder = "NIXPACKS"

[build.nixpacksConfig]
# WeasyPrint native deps (libpango/cairo/harfbuzz) replace chromium.
# Lighter image + faster cold start, no headless browser.
phases.setup.aptPkgs = [
    "ca-certificates",
    "fonts-liberation",
    "fonts-inter",
    "libpango-1.0-0",
    "libpangoft2-1.0-0",
    "libharfbuzz0b",
    "libcairo2",
    "libgdk-pixbuf-2.0-0",
    "shared-mime-info",
]

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
