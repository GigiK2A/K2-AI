      flex-direction: column;

      top: 0;

    .kapp-body {

      display: flex;
      overflow: hidden;
      min-height: 0;

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .kapp-sidebar {
      width: 240px;
      flex-shrink: 0;

      flex-direction: column;

      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      padding: 0 4px;

    .kapp-mode-grid {

    .kapp-mode-btn {

      background: transparent;
      color: #c0c8d4;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;

    .kapp-mode-btn-title {

      font-weight: 600;

    .kapp-mode-btn-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      line-height: 1.3;
    }

    .kapp-mode-btn.active .kapp-mode-btn-sub { color: rgba(0,200,180,0.6); }

    .kapp-conv-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      padding: 0 4px;
      margin-top: 8px;

    .kapp-new-btn {
      display: block;
      width: 100%;
      padding: 9px 14px;
      border: 1px dashed rgba(255,255,255,0.14);
      background: transparent;
      color: rgba(255,255,255,0.5);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      text-align: left;
      transition: border-color 0.15s, color 0.15s;
    }

    .kapp-new-btn:hover { border-color: rgba(0,200,180,0.4); color: rgba(0,200,180,0.8); }

    .kapp-conv-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kapp-conv-item {
      padding: 9px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.12s, color 0.12s;
    }

    .kapp-conv-item:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.8); }
    .kapp-conv-item.active { background: rgba(255,255,255,0.06); color: #f0f4f8; border-color: rgba(255,255,255,0.1); }

    /* ── Main area ───────────────────────────────────────────────── */
    .kapp-main {
      flex: 1;

      flex-direction: column;

      min-width: 0;

    .kapp-composer-wrap {

      font-size: 11px;
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: rgba(255,255,255,0.5);
      cursor: pointer;

    .kapp-sug:hover { border-color: rgba(0,200,180,0.4); color: rgba(0,200,180,0.9); }

    .kapp-composer {

    .kapp-textarea {

      border: none;
      outline: none;

    .kapp-composer-footer {

      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .kapp-attach {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      transition: border-color 0.15s, color 0.15s;
    }

    .kapp-attach:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.8); }

    .kapp-send {
      background: #00c8b4;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
      color: #000;
      font-size: 15px;
      font-weight: 600;
      transition: opacity 0.15s;

      align-items: center;
    }

    .kapp-send:disabled { opacity: 0.35; cursor: not-allowed; }
    .kapp-send:not(:disabled):hover { opacity: 0.85; }

    .kapp-error {

      color: rgba(255,120,120,0.9);
      padding: 6px 10px;
      border: 1px solid rgba(255,100,100,0.2);

    /* ── Mobile sidebar toggle ───────────────────────────────────── */
    .kapp-sidebar-toggle {
      display: none;
      background: transparent;

    @media (max-width: 768px) {

    .kapp-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00c8b4, #0ea5e9);
      border-radius: 99px;
      transition: width 0.4s ease;
    }
  </style>

<script>
(function() {
'use strict';

/* ── Utility ─────────────────────────────────────────────────────── */
let _clerkReady = false;
let _clerkInstance = null;

function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function prettyTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── API ─────────────────────────────────────────────────────────── */
const API = '/api';

async function fetchSkills() {
  try {
    const r = await fetch(`${API}/skills`, { headers: { Accept: 'application/json' } });
    if (!r.ok) return [];
    const d = await r.json();
    return d.skills || [];
  } catch { return []; }
}

async function sendChat(input, mode, paid, conversationId, contextFiles, authToken) {
  const headers = { 'Content-Type': 'application/json' };
  if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
  const r = await fetch(`${API}/chat`, {
    method: 'POST',
    headers,
    body: JSON.stringify({ input, mode, paid, conversation_id: conversationId, context_files: contextFiles }),
    signal: AbortSignal.timeout(120000),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.detail || d.error || `Errore ${r.status}`);
  return d;
}

async function uploadFiles(files, conversationId) {
  if (!files.length) return [];
  const form = new FormData();
  files.forEach(f => form.append('files', f));
  form.append('conversation_id', conversationId);
  const r = await fetch(`${API}/upload`, { method: 'POST', body: form });
  const d = await r.json();
  if (!r.ok) throw new Error(d.detail || 'Errore upload');
  return d.files || [];
}

async function startCheckout(authToken) {
  const r = await fetch(`${API}/stripe/checkout`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${authToken}` },
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.detail || 'Errore checkout');
  return d.url;
}

async function submitFeedback(reportId, rating, comment, authToken) {
  await fetch(`${API}/feedback`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
    body: JSON.stringify({ report_id: reportId, rating, comment }),
  }).catch(() => {});
}

/* ── Clerk ───────────────────────────────────────────────────────── */
let _getToken = async () => null;
let _isSignedIn = false;
let _hasPaid = false;
let _userEmail = '';

async function initClerk() {
  const key = window.__CLERK_PUBLISHABLE_KEY__;
  if (!key || _clerkReady) return;
  try {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js';
    script.async = true;
    await new Promise((res, rej) => { script.onload = res; script.onerror = rej; document.head.appendChild(script); });
    _clerkInstance = new window.Clerk(key);
    await _clerkInstance.load();
    _clerkReady = true;

    _isSignedIn = Boolean(_clerkInstance.user);
    if (_isSignedIn) {
      _hasPaid = Boolean(_clerkInstance.user?.publicMetadata?.has_paid);
      _userEmail = _clerkInstance.user?.primaryEmailAddress?.emailAddress || '';
      _getToken = async () => {
        try { return await _clerkInstance.session?.getToken() || null; }
        catch { return null; }
      };
    }

    renderAuthArea();
  } catch (e) {
    console.warn('Clerk non disponibile:', e);
  }
}

function signIn() {
  if (_clerkInstance) _clerkInstance.openSignIn({ redirectUrl: '/app' });
}

function signOut() {
  if (_clerkInstance) _clerkInstance.signOut().then(() => { _isSignedIn = false; _hasPaid = false; renderAuthArea(); });
}

function renderAuthArea() {
  const el = document.getElementById('kapp-auth-area');
  if (!el) return;
  if (state.mode !== 'report') { el.innerHTML = ''; return; }
  if (_isSignedIn) {
    const email = esc(_userEmail || 'Account');
    const badge = _hasPaid ? '<span style="font-size:10px;color:#00c8b4;margin-left:4px;">✓ Premium</span>' : '';
    el.innerHTML = `<span style="font-size:12px;color:rgba(255,255,255,0.5);margin-right:8px;">${email}${badge}</span><button class="kapp-auth-btn signed-in" onclick="signOut()">Esci</button>`;
  } else {
    el.innerHTML = `<button class="kapp-auth-btn" onclick="signIn()">Accedi</button>`;
  }
}

/* ── State ───────────────────────────────────────────────────────── */
const state = {
  mode: 'lead',
  conversations: [],
  activeId: null,
  loading: false,
  skills: [],
  usedSkills: [],
  pendingFiles: [],
  uploadedFiles: [],
};

function activeConv() {
  return state.conversations.find(c => c.id === state.activeId) || state.conversations[0];
}

function initState() {
  const conv = {
    id: uid(),
    title: 'Nuova conversazione',
    mode: 'lead',
    messages: [
      { id: uid(), role: 'assistant', content: 'Ciao, sono K2-AI. Posso guidarti su acquisizione clienti o generare report premium professionali.', ts: Date.now() }
    ],
  };
  state.conversations = [conv];
  state.activeId = conv.id;
}

/* ── Render ──────────────────────────────────────────────────────── */
function renderConvList() {
  const el = document.getElementById('kapp-conv-list');
  if (!el) return;
  el.innerHTML = state.conversations.map(c => {
    const active = c.id === state.activeId ? 'active' : '';
    return `<div class="kapp-conv-item ${active}" onclick="kapp.selectConv('${c.id}')">${esc(c.title)}</div>`;
  }).join('');
}

function renderChat() {
  const el = document.getElementById('kapp-chat');
  if (!el) return;
  const conv = activeConv();
  if (!conv) { el.innerHTML = ''; return; }

  const apiBase = '';

  let html = conv.messages.map(m => {
    const isBot = m.role === 'assistant';
    const cls = isBot ? 'bot' : 'user';
    const label = isBot ? '🤖 K2-AI' : '👤 Tu';
    const time = prettyTime(m.ts);

    let reportHtml = '';
    if (m.reportHtmlUrl || m.reportPdfDownloadUrl) {
      reportHtml = '<div class="kapp-report-actions">';
      if (m.reportHtmlUrl) {
        reportHtml += `<a href="${apiBase}${esc(m.reportHtmlUrl)}" target="_blank" rel="noreferrer" class="kapp-report-btn primary">Apri report</a>`;
      }
      if (m.reportHtmlDownloadUrl) {
        if (_hasPaid || state.mode === 'lead') {
          reportHtml += `<a href="${apiBase}${esc(m.reportHtmlDownloadUrl)}" download class="kapp-report-btn outline">Scarica HTML</a>`;
        } else {
          reportHtml += `<button class="kapp-report-btn pay" onclick="kapp.checkout()">Paga per scaricare</button>`;
        }
      }
      if (m.reportPdfDownloadUrl) {
        if (_hasPaid || state.mode === 'lead') {
          reportHtml += `<a href="${apiBase}${esc(m.reportPdfDownloadUrl)}" target="_blank" download class="kapp-report-btn muted">Scarica PDF</a>`;
        } else {
          reportHtml += `<button class="kapp-report-btn pay" onclick="kapp.checkout()">Paga per PDF</button>`;
        }
      }
      reportHtml += '</div>';

      if (m.reportPdfUrl && _isSignedIn) {
        const rid = esc(m.reportPdfUrl.split('/').pop() || '');
        reportHtml += renderFeedback(rid);
      }
    }

    return `
      <div class="kapp-msg ${cls}">
        <div class="kapp-msg-label">${label} <span style="margin-left:auto">${time}</span></div>
        <div class="kapp-msg-bubble">${esc(m.content)}${reportHtml}</div>
      </div>`;
  }).join('');

  if (state.loading) {
    html += `
      <div class="kapp-typing">
        <span class="kapp-dot"></span>
        <span class="kapp-dot"></span>
        <span class="kapp-dot"></span>
        <span id="kapp-typing-label">${state.mode === 'report' ? 'Generazione report in corso…' : 'K2-AI sta scrivendo…'}</span>
      </div>`;
    if (state.mode === 'report') {
      html += `
        <div class="kapp-progress-wrap" style="max-width:400px;align-self:flex-start;margin-left:4px;">
          <div class="kapp-progress-bar" id="kapp-progress" style="width:${state._progress || 5}%"></div>
        </div>`;
    }
  }

  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;

  // Attach feedback listeners
  el.querySelectorAll('[data-feedback-rid]').forEach(form => {
    const rid = form.dataset.feedbackRid;
    form.querySelectorAll('.kapp-star').forEach((star, i) => {
      star.addEventListener('click', () => handleFeedbackRating(form, i + 1));
    });
    const submitBtn = form.querySelector('[data-feedback-submit]');
    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        const rating = parseInt(form.dataset.feedbackRating || '0', 10);
        const comment = form.querySelector('input')?.value || '';
        handleFeedbackSubmit(rid, rating, comment, form);
      });
    }
  });
}

function renderFeedback(rid) {
  return `
    <div class="kapp-feedback" data-feedback-rid="${rid}">
      <div style="font-size:11px;color:rgba(255,255,255,0.4);">Come valuti il report?</div>
      <div class="kapp-stars">
        ${[1,2,3,4,5].map(i => `<span class="kapp-star" data-v="${i}">★</span>`).join('')}
      </div>
      <input type="text" placeholder="Commento opzionale…" style="max-width:320px;">
      <button class="kapp-report-btn muted" style="align-self:flex-start;font-size:11px;padding:5px 12px;" data-feedback-submit>Invia feedback</button>
    </div>`;
}

function handleFeedbackRating(form, rating) {
  form.dataset.feedbackRating = rating;
  form.querySelectorAll('.kapp-star').forEach((s, i) => {
    s.classList.toggle('selected', i < rating);
  });
}

async function handleFeedbackSubmit(rid, rating, comment, form) {
  if (!rating) return;
  const token = await _getToken();
  await submitFeedback(rid, rating, comment, token || '');
  form.innerHTML = '<span style="font-size:12px;color:rgba(0,200,180,0.8);">Grazie per il feedback!</span>';
}

function renderSkills(skills) {
  const el = document.getElementById('kapp-skills');
  if (!el) return;
  el.innerHTML = (skills || []).slice(0, 5).map(s => `<span class="kapp-skill-badge">${esc(typeof s === 'string' ? s : s.name || '')}</span>`).join('');
}

function renderModeUI() {
  document.getElementById('btn-lead')?.classList.toggle('active', state.mode === 'lead');
  document.getElementById('btn-report')?.classList.toggle('active', state.mode === 'report');
  const title = state.mode === 'lead' ? 'Lead diagnostica' : 'Report premium';
  const modeEl = document.getElementById('kapp-mode-title');
  if (modeEl) modeEl.textContent = title;
  renderSuggestions();
  renderAuthArea();
  renderChat();
}

function renderSuggestions() {
  const el = document.getElementById('kapp-suggestions');
  if (!el) return;
  const sugs = state.mode === 'report'
    ? ['Executive summary', 'Piano operativo', 'KPI chiave', 'Analisi rischi', 'Hospitality report']
    : ['Automazione email', 'Gestione documenti', 'CRM intelligente', 'Report finanziario', 'Customer service AI'];
  el.innerHTML = sugs.map(s => `<button class="kapp-sug" onclick="kapp.useSuggestion('${esc(s)}')">${esc(s)}</button>`).join('');
}

function renderAuthGate() {
  const el = document.getElementById('kapp-chat');
  if (!el) return;
  el.innerHTML = `
    <div class="kapp-auth-gate">
      <h3>Accedi per i report premium</h3>
      <p>La modalità Report genera documenti HTML e PDF con analisi professionali.<br>Richiede un account — è gratis per iniziare.</p>
      <div class="kapp-auth-gate-btns">
        <button class="kapp-auth-btn" onclick="signIn()">Accedi o registrati</button>
        <button class="kapp-auth-btn signed-in" onclick="kapp.setMode('lead')">Torna alla diagnostica gratuita</button>
      </div>
    </div>`;
}

/* ── Progress animation ──────────────────────────────────────────── */
let _progressTimer = null;

function startProgress() {
  state._progress = 5;
  clearInterval(_progressTimer);
  _progressTimer = setInterval(() => {
    if (state._progress < 88) {
      state._progress += (88 - state._progress) * 0.06;
      const bar = document.getElementById('kapp-progress');
      if (bar) bar.style.width = state._progress + '%';
    }
  }, 400);
}

function stopProgress() {
  clearInterval(_progressTimer);
  _progressTimer = null;
  state._progress = 100;
  const bar = document.getElementById('kapp-progress');
  if (bar) bar.style.width = '100%';
}

/* ── Main logic ──────────────────────────────────────────────────── */
const kapp = {
  async init() {
    initState();
    renderConvList();
    renderModeUI();
    renderChat();

    state.skills = await fetchSkills();

    // Input handlers
    const input = document.getElementById('kapp-input');
    const sendBtn = document.getElementById('kapp-send');
    if (input) {
      input.addEventListener('input', () => {
        input.style.height = '0';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
        if (sendBtn) sendBtn.disabled = !input.value.trim() || state.loading;
      });
      input.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!sendBtn.disabled) this.send();
        }
      });
    }

    // File input
    const fileInput = document.getElementById('kapp-file-input');
    if (fileInput) {
      fileInput.addEventListener('change', () => {
        const files = Array.from(fileInput.files || []);
        if (files.length) this.addFiles(files);
        fileInput.value = '';
      });
    }

    // Drag & drop on composer
    const dropZone = document.getElementById('kapp-drop-zone');
    if (dropZone) {
      dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = 'rgba(0,200,180,0.5)'; });
      dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
      dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.style.borderColor = '';
        const files = Array.from(e.dataTransfer?.files || []);
        if (files.length) this.addFiles(files);
      });
    }

    // Nav hamburger (reuse existing nav.js logic)
    const hamburger = document.getElementById('nav-hamburger-btn');
    const overlay = document.getElementById('nav-overlay');
    if (hamburger && overlay) {
      hamburger.addEventListener('click', () => overlay.classList.toggle('open'));
      overlay.querySelectorAll('a').forEach(a => a.addEventListener('click', () => overlay.classList.remove('open')));
    }

    // Init Clerk in background (non-blocking)
    initClerk().then(renderAuthArea);
  },

  setMode(mode) {
    state.mode = mode;
    if (mode === 'report' && !_isSignedIn && _clerkReady) {
      renderModeUI();
      renderAuthGate();
      return;
    }
    renderModeUI();
    this.closeSidebar();
  },

  newConversation() {
    const conv = {
      id: uid(),
      title: 'Nuova chat',
      mode: state.mode,
      messages: [],
    };
    state.conversations.unshift(conv);
    state.activeId = conv.id;
    state.pendingFiles = [];
    state.uploadedFiles = [];
    this.clearFilesUI();
    renderConvList();
    renderChat();
    renderSkills([]);
    this.closeSidebar();
  },

  selectConv(id) {
    state.activeId = id;
    state.pendingFiles = [];
    state.uploadedFiles = [];
    this.clearFilesUI();
    renderConvList();
    renderChat();
    this.closeSidebar();
  },

  toggleSidebar() {
    document.getElementById('kapp-sidebar')?.classList.toggle('open');
  },

  closeSidebar() {
    document.getElementById('kapp-sidebar')?.classList.remove('open');
  },

  useSuggestion(text) {
    const input = document.getElementById('kapp-input');
    if (input) {
      input.value = text;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }
  },

  addFiles(files) {
    state.pendingFiles.push(...files.slice(0, 5 - state.pendingFiles.length));
    this.renderFilesRow();
  },

  clearFilesUI() {
    state.pendingFiles = [];
    state.uploadedFiles = [];
    this.renderFilesRow();
  },

  renderFilesRow() {
    const row = document.getElementById('kapp-files-row');
    if (!row) return;
    if (!state.pendingFiles.length) { row.style.display = 'none'; row.innerHTML = ''; return; }
    row.style.display = 'flex';
    row.innerHTML = state.pendingFiles.map((f, i) => `
      <span class="kapp-file-chip">
        📄 ${esc(f.name)}
        <button class="kapp-file-chip-rm" onclick="kapp.removeFile(${i})">×</button>
      </span>`).join('');
  },

  removeFile(idx) {
    state.pendingFiles.splice(idx, 1);
    this.renderFilesRow();
  },

  showError(msg) {
    const el = document.getElementById('kapp-error');
    if (!el) return;
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  },

  async checkout() {
    const token = await _getToken();
    if (!token) { signIn(); return; }
    try {
      const url = await startCheckout(token);
      window.location.href = url;
    } catch (e) {
      this.showError(e.message);
    }
  },

  async send() {
    const input = document.getElementById('kapp-input');
    const text = input?.value.trim() || '';
    if (!text || state.loading) return;

    // Report mode without auth
    if (state.mode === 'report' && !_isSignedIn && _clerkReady) {
      renderAuthGate();
      return;
    }

    state.loading = true;
    document.getElementById('kapp-send').disabled = true;
    this.showError('');
    if (input) { input.value = ''; input.style.height = ''; }

    const conv = activeConv();
    if (!conv) return;

    // Add user message
    const userMsg = { id: uid(), role: 'user', content: text, ts: Date.now(), attachments: [...state.pendingFiles] };
    conv.messages.push(userMsg);
    if (conv.messages.length === 1 || (conv.messages.length === 2 && conv.title === 'Nuova chat')) {
      conv.title = text.slice(0, 36) + (text.length > 36 ? '…' : '');
    }
    renderChat();

    if (state.mode === 'report') startProgress();

    try {
      // Upload files if any
      let uploadedIds = [];
      if (state.pendingFiles.length) {
        const uploaded = await uploadFiles(state.pendingFiles, conv.id);
        uploadedIds = uploaded.map(f => f.fileId || f.id).filter(Boolean);
        state.pendingFiles = [];
        this.clearFilesUI();
      }

      const paid = state.mode === 'lead' ? true : _hasPaid;
      const token = state.mode === 'report' ? await _getToken() : null;

      const res = await sendChat(text, state.mode, paid, conv.id, uploadedIds, token);

      const botMsg = {
        id: uid(),
        role: 'assistant',
        content: res.answer || '',
        ts: Date.now(),
        reportPdfUrl: res.reportPdfUrl || null,
        reportPdfDownloadUrl: res.reportPdfDownloadUrl || null,
        reportPdfFilename: res.reportPdfFilename || null,
        reportHtmlUrl: res.reportHtmlUrl || null,
        reportHtmlDownloadUrl: res.reportHtmlDownloadUrl || null,
      };
      conv.messages.push(botMsg);

      state.usedSkills = res.usedSkills || [];
      renderSkills(state.usedSkills);
    } catch (e) {
      this.showError(e.message || 'Errore imprevisto');
    } finally {
      state.loading = false;
      if (state.mode === 'report') stopProgress();
      document.getElementById('kapp-send').disabled = false;
      renderConvList();
      renderChat();
    }
  },
};

document.addEventListener('DOMContentLoaded', () => kapp.init());
})();
</script>
