[project]
name = "ai-board"
version = "0.1.0"
description = "AI Board — sistema multi-agente per gestione business"
requires-python = ">=3.11"
dependencies = [
    "agno>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "supabase>=2.0.0",
    "ddgs>=9.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "python-telegram-bot>=21.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "python-multipart>=0.0.12",
    "pytz>=2024.1",
    "rich>=13.0.0",
    "markdown>=3.7",
    "bleach>=6.1.0",
    # Optional — only used when SENTRY_DSN env var is set at runtime.
    "sentry-sdk>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "controllers", "core", "db", "interfaces", "repositories", "services", "tools"]
