{% extends "base.html" %}
{% set suppress_page_header = true %}
{% set no_sidebar = true %}

{% block content %}

<!-- Top bar minimale per navigazione -->
<div class="flex items-center justify-between mb-6 pb-5 border-b border-gray-100">
  <div class="flex items-center gap-4">
    <a href="/" class="flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-700 transition-colors">
      <span class="material-symbols-outlined" style="font-size:16px">arrow_back</span>
      Board
    </a>
    <span class="text-gray-200">/</span>
    <span class="text-sm font-medium text-gray-900">Pipeline</span>
  </div>
  <button type="button"
          onclick="document.getElementById('new-lead-modal').style.display='flex'"
          class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
    <span class="material-symbols-outlined" style="font-size:16px">add</span>
    Nuovo lead
  </button>
</div>

<!-- Board kanban -->
<div class="overflow-x-auto pb-4">
  <div id="pipeline-board">
    {% include "partials/pipeline_board.html" %}
  </div>
</div>

{% endblock %}


{% block scripts %}
<!-- Modal nuovo lead -->
<div id="new-lead-modal"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4"
     onclick="if(event.target===this)this.classList.add('hidden')"
     style="display:none">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl" onclick="event.stopPropagation()">
    <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between">
      <h3 class="text-base font-semibold text-gray-900">Nuovo lead</h3>
      <button onclick="document.getElementById('new-lead-modal').style.display='none'"
              class="text-gray-400 hover:text-gray-600 transition-colors" type="button">
        <span class="material-symbols-outlined" style="font-size:20px">close</span>
      </button>
    </div>
    <form class="px-6 py-5 space-y-4"
          hx-post="/pipeline/lead"
          hx-target="#pipeline-board"
          hx-swap="innerHTML"
          hx-on::after-request="document.getElementById('new-lead-modal').style.display='none'">
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1.5">Nome *</label>
        <input name="name" required
               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1.5">Azienda</label>
        <input name="company"
               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">Settore</label>
          <input name="sector"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">Canale</label>
          <input name="channel"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1.5">Pain point</label>
        <textarea name="pain_point" rows="3"
                  class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button"
                onclick="document.getElementById('new-lead-modal').style.display='none'"
                class="flex-1 px-4 py-2.5 border border-gray-200 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors">
          Annulla
        </button>
        <button type="submit"
                class="flex-1 px-4 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
          Crea lead
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  document.getElementById('new-lead-modal').style.display = 'none';
  document.querySelector('[onclick*="new-lead-modal"]').addEventListener('click', function() {
    document.getElementById('new-lead-modal').style.display = 'flex';
  });
</script>
{% endblock %}
