<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/lead_generation/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-5">
    <input type="hidden" name="execution_mode" value="detail" />
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2">Nicchia</label>
            <select class="w-full bg-surface-container-low border-none rounded-lg text-sm py-2.5 focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer" name="nicchia">
                <option>Fintech Europe</option>
                <option>SaaS Enterprise</option>
                <option>Green Tech</option>
                <option>AI Startup (Early Stage)</option>
            </select>
        </div>
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2">Territorio</label>
            <select class="w-full bg-surface-container-low border-none rounded-lg text-sm py-2.5 focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer" name="territorio">
                <option>Global</option>
                <option>Europe (Tier 1)</option>
                <option>North America</option>
                <option>Custom...</option>
            </select>
        </div>
        <div class="md:col-span-2">
            <label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2">Territorio personalizzato</label>
            <input class="w-full bg-surface-container-low border-none rounded-lg text-sm py-2.5 focus:ring-2 focus:ring-primary/20 transition-all" name="territorio_personalizzato" placeholder="es. Milano, Berlino, Londra" type="text" />
        </div>
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2">Numero prospect</label>
            <input class="w-full bg-surface-container-low border-none rounded-lg text-sm py-2.5 focus:ring-2 focus:ring-primary/20 transition-all" name="numero_prospect" type="number" value="50" />
        </div>
        <div>
            <label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2">Scoring Priority</label>
            <select class="w-full bg-surface-container-low border-none rounded-lg text-sm py-2.5 focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer" name="scoring_priority">
                <option>Revenue Growth</option>
                <option>Team Expansion</option>
                <option>Web Traffic</option>
            </select>
        </div>
    </div>
    <div>
        <label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2">Criteri aggiuntivi</label>
        <textarea class="w-full bg-surface-container-low border-none rounded-lg text-sm py-2.5 focus:ring-2 focus:ring-primary/20 transition-all resize-none" name="criteri_aggiuntivi" placeholder="Aggiungi keyword specifiche o restrizioni..." rows="3"></textarea>
    </div>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
        <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
