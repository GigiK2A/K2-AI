<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/outreach/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-6">
    <input type="hidden" name="execution_mode" value="detail" />
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
            <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Tipo messaggio</label>
            <select class="w-full bg-surface-container-low border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/50" name="tipo_messaggio">
                <option>Cold Email</option>
                <option>LinkedIn DM</option>
                <option>Follow-up</option>
            </select>
        </div>
        <div class="space-y-2">
            <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Offerta</label>
            <select class="w-full bg-surface-container-low border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/50" name="offerta">
                <option>Enterprise Suite</option>
                <option>Consultancy</option>
                <option>Free Trial</option>
            </select>
        </div>
    </div>
    <div class="space-y-2">
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Dati prospect</label>
        <textarea class="w-full bg-surface-container-low border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/50 resize-none" name="dati_prospect" placeholder="Incolla qui il profilo LinkedIn o note aziendali..." rows="4"></textarea>
    </div>
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 bg-surface-container rounded-lg">
        <div class="flex items-center gap-6">
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-on-surface-variant uppercase">Tono</label>
                <select class="bg-transparent border-none text-xs font-bold p-0 focus:ring-0" name="tono">
                    <option>Professionale</option>
                    <option>Amichevole</option>
                    <option>Diretto</option>
                </select>
            </div>
            <div class="h-6 w-[1px] bg-outline-variant/30"></div>
            <label class="flex items-center gap-3">
                <span class="text-[10px] font-bold text-on-surface-variant uppercase">A/B Variant</span>
                <input class="w-5 h-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox" name="ab_variant" />
            </label>
        </div>
        <div class="flex items-center gap-3">
            <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
            <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
        </div>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
