<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/project_operations/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-5">
    <input type="hidden" name="execution_mode" value="detail" />
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Progetto</label>
            <select class="w-full bg-white border-outline-variant/20 rounded-md py-2 px-3 text-sm focus:ring-2 focus:ring-primary/30 transition-all outline-none" name="progetto">
                <option>Sviluppo Mobile App V2</option>
                <option>Migrazione Cloud AWS</option>
                <option>Refactoring Checkout</option>
            </select>
        </div>
        <div>
            <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Tipo report</label>
            <select class="w-full bg-white border-outline-variant/20 rounded-md py-2 px-3 text-sm focus:ring-2 focus:ring-primary/30 transition-all outline-none" name="tipo_report">
                <option>Executive Summary</option>
                <option>Technical Deep Dive</option>
                <option>Risk Assessment</option>
            </select>
        </div>
    </div>
    <div>
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Update activity</label>
        <textarea class="w-full bg-white border-outline-variant/20 rounded-md py-2 px-3 text-sm focus:ring-2 focus:ring-primary/30 transition-all outline-none" name="update_activity" placeholder="Descrivi le attività completate..." rows="3"></textarea>
    </div>
    <div>
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Blocks</label>
        <textarea class="w-full bg-white border-outline-variant/20 rounded-md py-2 px-3 text-sm focus:ring-2 focus:ring-primary/30 transition-all outline-none" name="blocks" placeholder="Eventuali impedimenti o criticità..." rows="2"></textarea>
    </div>
    <div>
        <label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Next milestone date</label>
        <input class="w-full bg-white border-outline-variant/20 rounded-md py-2 px-3 text-sm focus:ring-2 focus:ring-primary/30 transition-all outline-none" name="next_milestone_date" type="date" />
    </div>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
        <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
