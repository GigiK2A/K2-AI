<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/offer_positioning/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-5">
    <input type="hidden" name="execution_mode" value="detail" />
    <div>
        <label class="block text-[10px] uppercase tracking-widest font-bold text-outline mb-2">Tipo richiesta</label>
        <select class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-lg py-3 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" name="tipo_richiesta">
            <option>Nuovo Lancio</option>
            <option>Re-branding</option>
            <option>Upsell Strategico</option>
        </select>
    </div>
    <div>
        <label class="block text-[10px] uppercase tracking-widest font-bold text-outline mb-2">Nicchia target</label>
        <select class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-lg py-3 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" name="nicchia_target">
            <option>SaaS B2B Enterprise</option>
            <option>E-commerce High-End</option>
            <option>Professional Services</option>
        </select>
    </div>
    <div>
        <label class="block text-[10px] uppercase tracking-widest font-bold text-outline mb-2">Tier offerta</label>
        <div class="grid grid-cols-3 gap-3">
            <label class="cursor-pointer">
                <input class="sr-only peer" type="radio" name="tier_offerta" value="LOW" checked />
                <span class="flex items-center justify-center py-3 rounded-lg bg-surface-container-low text-on-surface-variant text-sm font-bold peer-checked:bg-primary peer-checked:text-white">LOW</span>
            </label>
            <label class="cursor-pointer">
                <input class="sr-only peer" type="radio" name="tier_offerta" value="MID" />
                <span class="flex items-center justify-center py-3 rounded-lg bg-surface-container-low text-on-surface-variant text-sm font-bold peer-checked:bg-primary peer-checked:text-white">MID</span>
            </label>
            <label class="cursor-pointer">
                <input class="sr-only peer" type="radio" name="tier_offerta" value="HIGH" />
                <span class="flex items-center justify-center py-3 rounded-lg bg-surface-container-low text-on-surface-variant text-sm font-bold peer-checked:bg-primary peer-checked:text-white">HIGH</span>
            </label>
        </div>
    </div>
    <div>
        <label class="block text-[10px] uppercase tracking-widest font-bold text-outline mb-2">Brief specifico</label>
        <textarea class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-lg py-3 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-outline-variant" name="brief_specifico" placeholder="Inserisci dettagli sull'attuale posizionamento e obiettivi..." rows="4"></textarea>
    </div>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
        <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
