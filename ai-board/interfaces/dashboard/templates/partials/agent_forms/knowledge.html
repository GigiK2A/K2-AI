<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/knowledge/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-5">
    <input type="hidden" name="execution_mode" value="detail" />
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Tipo asset</label>
            <select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md py-2 px-3 text-sm focus:ring-primary/20" name="tipo_asset">
                <option>SOP (Standard Operating Procedure)</option>
                <option>Case Study</option>
                <option>Template</option>
            </select>
        </div>
        <div>
            <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Progetto</label>
            <select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md py-2 px-3 text-sm focus:ring-primary/20" name="progetto">
                <option>The Intelligent Canvas</option>
                <option>Digital Curator API</option>
            </select>
        </div>
        <div>
            <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Agente</label>
            <select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md py-2 px-3 text-sm focus:ring-primary/20" name="agente">
                <option>GPT-4o (Default)</option>
                <option>Claude 3.5 Sonnet</option>
            </select>
        </div>
        <div>
            <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Nicchia</label>
            <select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md py-2 px-3 text-sm focus:ring-primary/20" name="nicchia">
                <option>Corporate Strategy</option>
                <option>Technical Documentation</option>
            </select>
        </div>
    </div>
    <div>
        <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Contenuto</label>
        <textarea class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md py-2 px-3 text-sm focus:ring-primary/20 placeholder:opacity-50" name="contenuto" placeholder="Incolla qui il testo da analizzare..." rows="5"></textarea>
    </div>
    <div>
        <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Tags</label>
        <input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md py-2 px-3 text-sm focus:ring-primary/20" name="tags" placeholder="es: brainstorming, q3, review" type="text" />
    </div>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
        <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
