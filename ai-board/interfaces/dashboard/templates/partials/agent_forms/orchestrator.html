<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/orchestrator/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-5">
    <input type="hidden" name="execution_mode" value="detail" />
    <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase mb-2">Descrizione obiettivo</label>
        <textarea class="w-full bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-indigo-600/50 focus:border-indigo-600 p-4 text-sm" name="descrizione_obiettivo" placeholder="Descrivi l'obiettivo che l'Orchestrator deve raggiungere..." rows="4"></textarea>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label class="block text-xs font-bold text-on-surface-variant uppercase mb-2">Orizzonte temporale</label>
            <select class="w-full bg-white border border-slate-200 rounded-md py-2 px-3 text-sm focus:ring-2 focus:ring-indigo-600/50" name="orizzonte_temporale">
                <option>Oggi</option>
                <option>Settimana</option>
                <option>Mese</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-bold text-on-surface-variant uppercase mb-2">Priorità</label>
            <select class="w-full bg-white border border-slate-200 rounded-md py-2 px-3 text-sm focus:ring-2 focus:ring-indigo-600/50" name="priorita">
                <option>Alta</option>
                <option>Media</option>
                <option>Bassa</option>
            </select>
        </div>
    </div>
    <label class="flex items-center gap-3 cursor-pointer group">
        <input class="w-5 h-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-600" type="checkbox" name="includi_briefing_chief_of_staff" />
        <span class="text-sm font-medium text-on-surface">Includi briefing Chief of Staff</span>
    </label>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
        <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
