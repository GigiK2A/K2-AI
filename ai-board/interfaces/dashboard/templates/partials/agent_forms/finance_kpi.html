<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/finance_kpi/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-5">
    <input type="hidden" name="execution_mode" value="detail" />
    <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Tipo report</label>
        <select class="w-full bg-surface-container-low border-none rounded-md px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20" name="tipo_report">
            <option>Pipeline Mensile</option>
            <option>Chiusura Trimestrale</option>
            <option>Forecast Q4</option>
        </select>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Revenue (€)</label>
            <input class="w-full bg-surface-container-low border-none rounded-md px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20" name="revenue_eur" placeholder="0.00" type="number" />
        </div>
        <div>
            <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Leads</label>
            <input class="w-full bg-surface-container-low border-none rounded-md px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20" name="leads" placeholder="Count" type="number" />
        </div>
        <div>
            <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Calls</label>
            <input class="w-full bg-surface-container-low border-none rounded-md px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20" name="calls" placeholder="Count" type="number" />
        </div>
        <div>
            <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Proposals</label>
            <input class="w-full bg-surface-container-low border-none rounded-md px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20" name="proposals" placeholder="Count" type="number" />
        </div>
    </div>
    <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Contracts</label>
        <input class="w-full bg-surface-container-low border-none rounded-md px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20" name="contracts" placeholder="Count" type="number" />
    </div>
    <div>
        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Notes</label>
        <textarea class="w-full bg-surface-container-low border-none rounded-md px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 resize-none" name="notes" placeholder="Inserisci dettagli aggiuntivi sulla performance..." rows="4"></textarea>
    </div>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
        <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
