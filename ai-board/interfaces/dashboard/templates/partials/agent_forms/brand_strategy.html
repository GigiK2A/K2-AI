<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/brand_strategy/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-6">
    <input type="hidden" name="execution_mode" value="detail" />
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-2">
            <label class="text-[10px] uppercase font-bold text-on-surface-variant tracking-wider">Tipo task</label>
            <select class="w-full bg-surface-container-low border-none rounded-md text-sm py-2.5 focus:ring-2 focus:ring-primary/20" name="tipo_task">
                <option>Analisi Coerenza Narrativa</option>
                <option>Generazione Tagline</option>
                <option>Revisione Tone of Voice</option>
            </select>
        </div>
        <div class="space-y-2">
            <label class="text-[10px] uppercase font-bold text-on-surface-variant tracking-wider">Formato output</label>
            <select class="w-full bg-surface-container-low border-none rounded-md text-sm py-2.5 focus:ring-2 focus:ring-primary/20" name="formato_output">
                <option>Markdown Report</option>
                <option>JSON Schema</option>
                <option>Bullet Points</option>
            </select>
        </div>
    </div>
    <div class="space-y-2">
        <label class="text-[10px] uppercase font-bold text-on-surface-variant tracking-wider">Contenuto da analizzare</label>
        <textarea class="w-full bg-surface-container-low border-none rounded-md text-sm p-4 focus:ring-2 focus:ring-primary/20 resize-none" name="contenuto_da_analizzare" placeholder="Inserisci il testo qui..." rows="4"></textarea>
    </div>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
        <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
