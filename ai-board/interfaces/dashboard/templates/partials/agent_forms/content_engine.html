<form
    hx-post="/agents/content_engine/generate"
    hx-target="#run-result"
    hx-swap="outerHTML"
    hx-indicator="#content-engine-run-spinner"
    class="space-y-7">

    <div class="grid grid-cols-2 gap-5">
        <div>
            <label class="block text-[12px] font-extrabold uppercase tracking-tight text-on-surface-variant mb-3">Tipo contenuto</label>
            <select class="w-full rounded-xl border-none bg-surface-container-low text-[18px] font-medium py-4 px-4 focus:ring-2 focus:ring-primary/20" name="tipo_contenuto">
                <option>Post LinkedIn</option>
                <option>Email</option>
                <option>Mini Case Study</option>
                <option>Script Video</option>
                <option>Carosello</option>
            </select>
        </div>
        <div>
            <label class="block text-[12px] font-extrabold uppercase tracking-tight text-on-surface-variant mb-3">Obiettivo</label>
            <select class="w-full rounded-xl border-none bg-surface-container-low text-[18px] font-medium py-4 px-4 focus:ring-2 focus:ring-primary/20" name="obiettivo">
                <option>Thought Leadership</option>
                <option>Educativo pratico</option>
                <option>Proof / Caso reale</option>
                <option>Lead generation</option>
                <option>Promozione offerta</option>
            </select>
        </div>
        <div>
            <label class="block text-[12px] font-extrabold uppercase tracking-tight text-on-surface-variant mb-3">Nicchia target</label>
            <select class="w-full rounded-xl border-none bg-surface-container-low text-[18px] font-medium py-4 px-4 focus:ring-2 focus:ring-primary/20" name="nicchia_target">
                <option>B&amp;B e affittacamere</option>
                <option>Ristorazione locale</option>
                <option>Studi tecnici e PMI</option>
                <option>Fintech</option>
                <option>Generica</option>
            </select>
        </div>
        <div>
            <label class="block text-[12px] font-extrabold uppercase tracking-tight text-on-surface-variant mb-3">Caso studio</label>
            <select class="w-full rounded-xl border-none bg-surface-container-low text-[18px] font-medium py-4 px-4 focus:ring-2 focus:ring-primary/20" name="caso_studio">
                <option>Nessuno</option>
                <option>Sito costruito con assistenti AI</option>
                <option>App per verbali di sopralluogo</option>
                <option>Sistemi interni AI-assisted</option>
                <option>Board di agenti AI</option>
            </select>
        </div>
    </div>

    <div>
        <label class="block text-[12px] font-extrabold uppercase tracking-tight text-on-surface-variant mb-3">Brief</label>
        <textarea
            class="w-full rounded-2xl border-none bg-surface-container-low text-[16px] leading-8 py-4 px-4 min-h-[130px] resize-none focus:ring-2 focus:ring-primary/20"
            name="brief"
            placeholder="Descrivi il tema principale e i punti chiave da toccare..."></textarea>
    </div>

    <div class="space-y-3">
        <div class="flex items-center justify-between gap-4">
            <label class="block text-[12px] font-extrabold uppercase tracking-tight text-on-surface-variant">Numero varianti</label>
            <output id="content-engine-variants-output" class="w-10 h-10 rounded-xl bg-primary-container text-primary flex items-center justify-center text-lg font-bold">3</output>
        </div>
        <input
            class="w-full accent-primary h-2 bg-surface-container-high rounded-full appearance-none cursor-pointer"
            max="5"
            min="1"
            name="numero_varianti"
            type="range"
            value="3"
            oninput="document.getElementById('content-engine-variants-output').value=this.value" />
    </div>

    <button
        type="submit"
        class="w-full flex items-center justify-center gap-3 px-6 py-5 rounded-2xl bg-gradient-to-b from-primary to-primary-dim text-white text-[18px] font-bold shadow-xl shadow-primary/25 hover:shadow-primary/35 transition-all">
        <span class="material-symbols-outlined text-[22px]">auto_awesome</span>
        Genera contenuto
    </button>

    <div id="content-engine-run-spinner" class="htmx-indicator text-sm text-on-surface-variant">
        Generazione in corso...
    </div>
</form>

<div id="run-result" class="mt-6 bg-surface-container-low rounded-2xl p-5 border border-dashed border-outline-variant/30">
    <div>
        <h3 class="text-sm font-bold uppercase tracking-wider text-on-surface-variant mb-2">Risultato</h3>
        <p class="text-sm text-on-surface-variant">Compila il brief e genera un draft pronto da approvare.</p>
    </div>
</div>
