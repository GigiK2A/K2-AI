<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/chief_of_staff/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-6">
    <input type="hidden" name="execution_mode" value="detail" />
    <input type="hidden" name="modello_ia" value="gpt-4o (Predefinito)" />
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
            <label class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Tipo briefing</label>
            <select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all appearance-none" name="tipo_briefing">
                <option>Giornaliero</option>
                <option>Settimanale</option>
                <option>Post-piano</option>
            </select>
        </div>
        <div class="space-y-2">
            <label class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Modello IA</label>
            <div class="px-4 py-3 bg-surface-container-lowest border border-outline-variant/10 rounded-lg text-sm text-on-surface-variant flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">verified</span>
                gpt-4o (Predefinito)
            </div>
        </div>
    </div>
    <div class="space-y-2">
        <label class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Contesto aggiuntivo</label>
        <textarea class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" name="contesto_aggiuntivo" placeholder="Inserisci note specifiche per questa esecuzione..." rows="4"></textarea>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
        <label class="flex items-center justify-between p-4 bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-white transition-colors group">
            <span class="text-sm font-semibold text-on-surface">Includi alert scadenze</span>
            <input checked class="w-5 h-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox" name="includi_alert_scadenze" />
        </label>
        <label class="flex items-center justify-between p-4 bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-white transition-colors group">
            <span class="text-sm font-semibold text-on-surface">Includi blocchi attivi</span>
            <input class="w-5 h-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox" name="includi_blocchi_attivi" />
        </label>
    </div>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
        <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
