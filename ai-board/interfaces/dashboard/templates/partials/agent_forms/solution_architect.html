<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-6">
    <p class="text-xs text-amber-700">L'output sarà salvato come Draft in attesa di approvazione.</p>
</div>
<form hx-post="/agents/solution_architect/run" hx-target="#run-result" hx-swap="outerHTML" hx-indicator="#run-spinner" class="space-y-5">
    <input type="hidden" name="execution_mode" value="detail" />
    <div>
        <label class="label-md font-bold text-on-surface-variant text-xs">Brief cliente</label>
        <textarea class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md p-3 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" name="brief_cliente" placeholder="Descrivi le necessità del cliente e gli obiettivi del progetto..." rows="4"></textarea>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="space-y-2">
            <label class="label-md font-bold text-on-surface-variant text-xs">Tipo soluzione</label>
            <select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md p-2.5 text-sm outline-none focus:border-primary" name="tipo_soluzione">
                <option>RAG Pipeline</option>
                <option>Multi-Agent System</option>
                <option>Content Engine</option>
            </select>
        </div>
        <div class="space-y-2">
            <label class="label-md font-bold text-on-surface-variant text-xs">Complessità</label>
            <select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md p-2.5 text-sm outline-none focus:border-primary" name="complessita">
                <option>Base</option>
                <option>Enterprise</option>
                <option>Custom</option>
            </select>
        </div>
        <div class="space-y-2">
            <label class="label-md font-bold text-on-surface-variant text-xs">Stack</label>
            <select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-md p-2.5 text-sm outline-none focus:border-primary" name="stack">
                <option>Python / LangChain</option>
                <option>Node.js / Vercel AI</option>
                <option>No-Code / Make</option>
            </select>
        </div>
    </div>
    <label class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-on-surface-variant">monetization_on</span>
            <div>
                <p class="text-sm font-bold">Cost estimation</p>
                <p class="text-[10px] text-on-surface-variant">Includi stima dei token e infrastruttura</p>
            </div>
        </div>
        <input class="w-5 h-5 rounded border-slate-300 text-primary focus:ring-primary" type="checkbox" name="cost_estimation" />
    </label>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 text-sm font-semibold text-white rounded-lg bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 transition-all">Esegui agente →</button>
        <span id="run-spinner" class="htmx-indicator text-xs text-slate-400">In esecuzione...</span>
    </div>
</form>
<div id="run-result" class="mt-4"></div>
