    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #abb3b7; border-radius: 10px; }
        .markdown-body { color: #2b3437; font-size: 0.92rem; line-height: 1.65; }
        .markdown-body > * + * { margin-top: 0.85rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: #111827; font-weight: 700; line-height: 1.25; }
        .markdown-body.text-white, .markdown-body.text-white * { color: inherit; }
        .markdown-body.text-white strong, .markdown-body.text-white code { color: inherit; }
        .markdown-body.text-white code { background: rgba(255,255,255,0.16); }
        .markdown-body h1 { font-size: 1.4rem; }
        .markdown-body h2 { font-size: 1.2rem; }
        .markdown-body h3 { font-size: 1rem; }
        .markdown-body strong { font-weight: 700; color: #111827; }
        .markdown-body em { font-style: italic; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.2rem; }
        .markdown-body li + li { margin-top: 0.35rem; }
        .markdown-body blockquote { border-left: 3px solid #cbd5e1; padding-left: 0.9rem; color: #475569; }
        .markdown-body table { width: 100%; border-collapse: collapse; border-radius: 0.5rem; background: white; font-size: 0.85rem; overflow: hidden; }
        .markdown-body thead { background: #eef2ff; color: #3730a3; }
        .markdown-body th, .markdown-body td { padding: 0.65rem 0.75rem; border: 1px solid #e2e8f0; text-align: left; vertical-align: top; }
        .markdown-body code { background: #e2e8f0; color: #1e293b; padding: 0.1rem 0.35rem; border-radius: 0.35rem; font-size: 0.85em; }
        .markdown-body pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; }
        .markdown-body pre code { background: transparent; color: inherit; padding: 0; }
    </style>

<body class="bg-surface text-on-surface">
    <aside class="fixed left-0 top-0 h-full w-[220px] bg-slate-50 flex flex-col p-4 space-y-2 z-50">

        </div>

    <div id="approval-modal"></div>

    <script>
        window.aiBoard = window.aiBoard || {};

        window.aiBoard.initAiCharts = function (root = document) {
            if (!window.Chart) return;
            const nodes = [];
            if (root.matches && root.matches("[data-ai-chart-config]")) nodes.push(root);
            if (root.querySelectorAll) nodes.push(...root.querySelectorAll("[data-ai-chart-config]"));

            for (const canvas of nodes) {
                const existing = window.Chart.getChart(canvas);
                if (existing) existing.destroy();
                try {
                    const config = JSON.parse(canvas.dataset.aiChartConfig || "{}");
                    if (!config.options) config.options = {};
                    if (!config.options.plugins) config.options.plugins = {};
                    if (!config.options.plugins.legend) config.options.plugins.legend = { position: "bottom" };
                    config.options.responsive = config.options.responsive !== false;
                    new window.Chart(canvas, config);
                } catch (error) {
                    const wrapper = canvas.parentElement;
                    if (wrapper) {
                        wrapper.innerHTML = '<div class="text-xs text-rose-700 bg-rose-50 border border-rose-100 rounded-lg p-3">Impossibile renderizzare il grafico generato.</div>';
                    }
                }
            }
        };

        document.getElementById("approval-modal").addEventListener("click", function (event) {
            if (event.target === this) this.innerHTML = "";
        });

        document.addEventListener("DOMContentLoaded", function () {
            window.aiBoard.initAiCharts(document);
        });

        document.body.addEventListener("htmx:afterSwap", function (event) {
            window.aiBoard.initAiCharts(event.target);
        });
    </script>
