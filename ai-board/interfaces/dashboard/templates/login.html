<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · AI Board</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gray-950 text-gray-900">
  <main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl">
      <div class="mb-7">
        <div class="mb-4 flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white font-bold">AI</div>
        <h1 class="text-xl font-semibold text-gray-950">Entra nel board</h1>
        <p class="mt-2 text-sm leading-6 text-gray-600">Usa l'account creato dall'amministratore K-AI.</p>
      </div>

      {% if error %}
      <div class="mb-5 rounded-xl border border-rose-100 bg-rose-50 px-4 py-3 text-sm text-rose-800">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="next" value="{{ next }}" />
        <div>
          <label class="mb-1.5 block text-xs font-medium text-gray-500">Email</label>
          <input name="email" type="email" required autofocus autocomplete="username"
                 class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="mb-1.5 block text-xs font-medium text-gray-500">Password</label>
          <input name="password" type="password" required autocomplete="current-password"
                 class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <button type="submit"
                class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-indigo-700">
          Accedi
        </button>
      </form>
    </section>
  </main>
</body>
</html>
