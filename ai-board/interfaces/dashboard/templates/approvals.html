{% extends "base.html" %}

{% block content %}
{# Sticky top header #}
<header class="sticky top-0 z-40 w-full bg-white/80 backdrop-blur-xl border-b border-slate-100 px-8 h-16 flex items-center justify-between">
    <div class="flex items-baseline gap-3">
        <h2 class="text-2xl font-bold tracking-tighter text-on-surface">Approvazioni</h2>
        <span class="text-on-surface-variant font-medium text-sm">{{ pending|length }} in attesa</span>
    </div>
    <div class="flex items-center gap-4">
        <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
            <input id="approval-search"
                   class="pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant/20 rounded-xl text-sm w-64 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
                   placeholder="Cerca tra le richieste..." type="text"
                   oninput="filterApprovals(this.value)" />
        </div>
    </div>
</header>

{# Main content #}
<section class="max-w-5xl mx-auto px-8 py-10">
    {# Tabs #}
    <div class="flex items-center gap-10 mb-10 border-b border-slate-100">
        <button onclick="showTab('pending')" id="tab-pending"
                class="tab-header pb-4 text-sm font-bold text-primary border-b-2 border-primary flex items-center gap-2">
            In attesa
            {% if pending %}
            <span class="bg-primary text-white text-[10px] px-1.5 py-0.5 rounded font-black">{{ pending|length }}</span>
            {% endif %}
        </button>
        <button onclick="showTab('approved')" id="tab-approved"
                class="tab-header pb-4 text-sm font-medium text-outline-variant hover:text-on-surface transition-all flex items-center gap-2">
            Approvati
        </button>
        <button onclick="showTab('rejected')" id="tab-rejected"
                class="tab-header pb-4 text-sm font-medium text-outline-variant hover:text-on-surface transition-all flex items-center gap-2">
            Rifiutati
        </button>
    </div>

    {# Tab content #}
    <div id="approvals-list">
        {% include "partials/approvals_list.html" %}
    </div>
</section>

{# Modal container #}
<div id="approval-modal"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-on-surface/40 backdrop-blur-sm p-4"
     onclick="if(event.target===this){closeModal()}">
</div>

<script>
function showTab(name) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
    document.querySelectorAll('.tab-header').forEach(b => {
        b.classList.remove('text-primary', 'border-b-2', 'border-primary', 'font-bold');
        b.classList.add('text-outline-variant', 'font-medium');
    });
    const panel = document.getElementById('panel-' + name);
    if (panel) panel.classList.remove('hidden');
    const btn = document.getElementById('tab-' + name);
    if (btn) {
        btn.classList.add('text-primary', 'border-b-2', 'border-primary', 'font-bold');
        btn.classList.remove('text-outline-variant', 'font-medium');
    }
}
function closeModal() {
    const modal = document.getElementById('approval-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    modal.innerHTML = '';
}
function filterApprovals(query) {
    const q = query.toLowerCase();
    document.querySelectorAll('.approval-card').forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(q) ? '' : 'none';
    });
}
// Listen for htmx after-settle to re-apply tab if needed
document.body.addEventListener('htmx:afterSettle', function(e) {
    if (e.target.id === 'approvals-list') showTab('pending');
});
// Open modal when htmx fills #approval-modal
document.body.addEventListener('htmx:afterSwap', function(e) {
    if (e.target.id === 'approval-modal' && e.target.innerHTML.trim()) {
        e.target.classList.remove('hidden');
        e.target.classList.add('flex');
    }
});
</script>
{% endblock %}
