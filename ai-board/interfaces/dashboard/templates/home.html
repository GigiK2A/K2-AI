{% extends "base.html" %}

{% block content %}

<!-- KPI Cards -->
<div id="kpi-cards"
     class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"
     hx-get="/partials/kpi"
     hx-trigger="every 30s"
     hx-swap="outerHTML">
  {% include "partials/kpi_cards.html" %}
</div>

<!-- Activity feed -->
<div class="bg-white rounded-xl border border-gray-100">
  <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
    <h2 class="text-sm font-semibold text-gray-900">Attività recente</h2>
    <div id="activity-feed-inner"
         hx-get="/partials/activity"
         hx-trigger="every 15s"
         hx-swap="outerHTML">
    </div>
  </div>
  <div id="activity-feed" class="divide-y divide-gray-50">
    {% include "partials/activity_feed.html" %}
  </div>
</div>

{% endblock %}
