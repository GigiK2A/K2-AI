<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K2-AI Operating System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']},colors:{brand:'#2563EB',ok:'#16A34A',violet:'#7C3AED'}}}};</script>
<style>
  body{background:#f5f7fb;color:#0f172a}
  .card{background:#fff;border:1px solid #eef1f6;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.04)}
  .navi{display:flex;align-items:center;gap:.65rem;padding:.55rem .8rem;border-radius:10px;color:#475569;font-weight:600;font-size:.875rem;cursor:pointer}
  .navi:hover{background:#f1f5f9}.navi.active{background:#eff4ff;color:#2563EB}
  .navi.soon{opacity:.45}
  .tab{padding:.5rem .15rem;color:#64748b;font-weight:600;font-size:.84rem;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .tab.active{color:#2563EB;border-color:#2563EB}
  .chip{font-size:.62rem;font-weight:700;padding:.14rem .55rem;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .real{font-size:.56rem;font-weight:700;color:#2563EB;background:#eff4ff;border-radius:999px;padding:.08rem .45rem;text-transform:uppercase;letter-spacing:.03em}
  .up{color:#16A34A;font-weight:700;font-size:.72rem}.muted{color:#94a3b8;font-weight:600;font-size:.72rem}
  .sec-t{font-weight:800;color:#111827;letter-spacing:-.01em}
  ::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#dde3ec;border-radius:8px}
  /* ---- premium ---- */
  body{background:#F5F7FB;color:#111827;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .card{background:#fff;border:1px solid #E6EAF2;border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.03),0 14px 32px -16px rgba(16,24,40,.10)}
  .lift{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s}
  .lift:hover{transform:translateY(-3px);box-shadow:0 22px 44px -20px rgba(37,99,235,.22);border-color:#dbe3f5}
  .glass{background:rgba(255,255,255,.80);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,.75);box-shadow:0 24px 60px -24px rgba(16,24,40,.40)}
  .kpiv{font-variant-numeric:tabular-nums;letter-spacing:-.025em;color:#111827}
  .heroWrap{position:relative;border-radius:24px;overflow:hidden;min-height:240px;border:1px solid #E6EAF2}
  .heroBg{position:absolute;inset:0;background:radial-gradient(130% 150% at 86% 8%,#cfe0ff 0%,#e9f0fb 40%,#f6f9fd 72%),linear-gradient(120deg,#eaf1ff,#f5f7fb)}
  .heroImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .heroGrid2{position:absolute;inset:0;background-image:linear-gradient(rgba(37,99,235,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.06) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
  .glow{position:absolute;border-radius:999px;filter:blur(46px);opacity:.5}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .fu{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
  @keyframes dash{to{stroke-dashoffset:0}}
  .spark path.l{stroke-dasharray:160;stroke-dashoffset:160;animation:dash 1.2s ease .15s forwards}
  @keyframes ringfill{to{stroke-dashoffset:var(--o)}}
  @keyframes ppulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
  .ppulse{animation:ppulse 2.2s ease-in-out infinite}
  .btn-app{background:#16A34A;color:#fff}.btn-app:hover{background:#15912f}
  .btn-sec{border:1px solid #E6EAF2;color:#475569;background:#fff}.btn-sec:hover{background:#f8fafc}
  /* live agent scene */
  .scene{position:relative;border-radius:20px;overflow:hidden;background:
    radial-gradient(120% 130% at 85% 0%,#dbe8ff 0%,#eef3fb 45%,#f6f9fd 75%);border:1px solid #E6EAF2}
  .stz{background:rgba(255,255,255,.72);backdrop-filter:blur(8px);border:1px solid #E6EAF2;border-radius:14px;padding:10px 11px;transition:all .35s cubic-bezier(.2,.7,.2,1)}
  .stz.run{border-color:#2563EB;box-shadow:0 0 0 2px rgba(37,99,235,.18),0 14px 28px -16px rgba(37,99,235,.5)}
  .stz.done{border-color:#16A34A33;box-shadow:0 10px 24px -16px rgba(22,163,74,.4)}
  .stz.queue{opacity:.6}
  .scr{height:24px;border-radius:7px;background:linear-gradient(180deg,#f1f5ff,#fff);border:1px solid #eef2f7;overflow:hidden}
  @keyframes flow{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
  .stz.run .scr::after{content:"";display:block;height:100%;width:30%;background:linear-gradient(90deg,transparent,rgba(37,99,235,.35),transparent);animation:flow 1.1s linear infinite}
  .dot-run{width:7px;height:7px;border-radius:999px;background:#2563EB;animation:ppulse 1.1s ease-in-out infinite}
  .dot-done{width:7px;height:7px;border-radius:999px;background:#16A34A}
  .dot-idle{width:7px;height:7px;border-radius:999px;background:#cbd5e1}
  .pbar{height:7px;border-radius:999px;background:#eef2f7;overflow:hidden}
  .pfill{height:100%;border-radius:999px;background:linear-gradient(90deg,#2563EB,#7aa2f7);animation:grow 1.1s cubic-bezier(.2,.7,.2,1)}
  @keyframes grow{from{width:0}}
  .arow{transition:background .2s}.arow:hover{background:#f8fafc}
  .ava{width:42px;height:42px;border-radius:999px;background:radial-gradient(120% 120% at 30% 20%,#eaf1ff,#dbe7fb);border:1px solid #E6EAF2;display:grid;place-items:center}
</style>
</head>
<body class="font-sans text-[15px]">
<div class="flex min-h-screen">

  <aside class="w-60 shrink-0 bg-white border-r border-slate-100 flex flex-col p-4 sticky top-0 h-screen">
    <div class="flex items-center gap-2 px-2 pb-5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white grid place-items-center font-extrabold">K</div>
      <div><div class="font-extrabold leading-none">K2-AI</div><div class="text-[11px] text-slate-400">Operating System</div></div>
    </div>
    <nav id="nav" class="space-y-1 flex-1 overflow-auto">
      <div class="navi" data-view="overview">▦ Overview</div>
      <div class="navi" data-view="agents">✦ AI Agents</div>
      <div data-group="domains" class="space-y-1"></div>
      <div class="text-[10px] font-bold text-slate-300 px-3 pt-3 pb-1 tracking-widest">SYSTEM</div>
      <div class="navi" data-view="dom:operations">▤ Projects</div>
      <div class="navi" data-view="documents">▢ Documents</div>
      <div class="navi soon" data-view="soon">⟳ Automations</div>
      <div class="navi" data-view="analytics">▭ Analytics</div>
      <div class="navi" data-view="settings">⚙ Settings</div>
    </nav>
    <div class="card p-3.5 mt-3">
      <div class="text-[11px] font-bold text-slate-500 mb-2.5">K2-AI Core Status</div>
      <div class="space-y-2 text-[12px]">
        <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500 ppulse"></span><b id="cs-agents" class="kpiv">18</b><span class="text-slate-400">Agenti attivi</span></div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-500"></span><b id="cs-aud" class="kpiv">42</b><span class="text-slate-400">Automazioni attive</span></div>
        <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber-500"></span><b id="cs-pending" class="kpiv">7</b><span class="text-slate-400">Decisioni in attesa</span></div>
      </div>
      <div class="mt-3">
        <div class="flex justify-between text-[11px] mb-1"><span class="text-slate-400">System Health</span><b class="text-emerald-600">98%</b></div>
        <div class="h-1.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full" style="width:98%;background:linear-gradient(90deg,#16A34A,#22c55e)"></div></div>
      </div>
    </div>
    <div class="flex items-center gap-2 px-1 pt-3">
      <div class="w-8 h-8 rounded-full bg-slate-200 grid place-items-center text-xs font-bold">LR</div>
      <div><div class="text-sm font-bold leading-none">Luigi</div><div class="text-[11px] text-slate-400">CEO · K2-AI</div></div>
    </div>
  </aside>

  <div class="flex-1 min-w-0">
    <header class="flex items-center gap-4 px-7 py-4 bg-white/80 backdrop-blur border-b border-slate-100 sticky top-0 z-10">
      <div><div id="hd-title" class="font-extrabold text-lg leading-none">Overview</div>
        <div id="hd-sub" class="text-[12px] text-slate-400 mt-0.5">tutta l'azienda in tempo reale</div></div>
      <div class="flex-1"></div>
      <div class="hidden lg:flex items-center gap-2 bg-slate-100 rounded-xl px-3 py-2 w-56 text-slate-400 text-sm">🔍 Ask AIOS anything… <span class="ml-auto text-[11px] bg-white rounded px-1.5 py-0.5">⌘K</span></div>
      <button id="btn-run" onclick="runAgent()" class="hidden text-sm font-semibold bg-brand text-white rounded-xl px-3 py-2">▶ Fai girare l'agente</button>
      <button onclick="load()" class="text-sm font-semibold border border-slate-200 rounded-xl px-3 py-2">↻ Aggiorna</button>
    </header>
    <main id="view" class="p-7 space-y-6 max-w-[1320px]"></main>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const NUM=x=>(x===undefined||x===null||x===""||Number.isNaN(x))?"—":x;
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const eur=n=>(n==null||Number.isNaN(n))?"—":"€"+Number(n).toLocaleString("it-IT");
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(u);return r.json();}
async function jpost(u,b){return (await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json();}
const PAL=["#2563EB","#16A34A","#7C3AED","#F59E0B","#06B6D4","#EF4444","#94A3B8"];
const PRIO=["Alta","Media","Bassa"],prioColor={Alta:"text-red-600",Media:"text-amber-600",Bassa:"text-slate-500"};
const META={
  marketing:{ico:"◈",label:"Marketing",sub:"Operazioni marketing data-driven · @k2_ai.it"},
  vendite:{ico:"⊞",label:"Sales / CRM",sub:"Pipeline, lead e proposte commerciali"},
  finance:{ico:"€",label:"Finance",sub:"Ricavi, costi, forecast e scadenze fiscali"},
  operations:{ico:"⚙",label:"Operations",sub:"Commesse, fasi, SAL e avanzamento"},
  legal:{ico:"§",label:"Legal & Compliance",sub:"GDPR, consensi, contratti e compliance"},
  hr:{ico:"☺",label:"HR",sub:"Persone, recruiting, onboarding e org"},
};
const TBL={
  leggi_lead:"Lead pipeline",leggi_memo_vendite:"Memo vendite",leggi_clienti:"Clienti",leggi_ricavi_chiusi:"Ricavi chiusi",leggi_lead_kbot:"Lead da K-BOT",leggi_suite:"Catalogo suite",leggi_inbox:"Inbox email",leggi_calendario_google:"Calendario",
  leggi_conversioni:"Conversioni K-BOT",leggi_revenue:"Eventi ricavo (Stripe)",leggi_valore_commesse:"Valore commesse",leggi_memoria_finance:"Memoria finance",leggi_costi:"Costi",leggi_stripe_ricavi:"Ricavi Stripe",leggi_stripe_saldo:"Saldo Stripe",leggi_fatture:"Fatture",leggi_giornale:"Giornale contabile",leggi_organico:"Organico",
  leggi_commesse:"Commesse",leggi_fasi:"Fasi progetto",leggi_task_commessa:"Task commessa",leggi_documenti:"Documenti",leggi_task_operativi:"Task operativi",leggi_team:"Team",leggi_change_requests:"Change request",leggi_strumenti:"Strumenti",
  leggi_iscritti_newsletter:"Iscritti newsletter",leggi_consensi_kbot:"Consensi K-BOT",leggi_documenti_legali:"Documenti legali",leggi_registro_trattamenti:"Registro trattamenti",leggi_fornitori:"Fornitori",leggi_marchi:"Marchi",leggi_atti_societari:"Atti societari",leggi_contenziosi:"Contenziosi",leggi_assicurazioni:"Assicurazioni",leggi_formazione_compliance:"Formazione compliance",leggi_policy:"Policy",
  leggi_dipendenti:"Dipendenti",leggi_candidati:"Candidati",leggi_assegnatari:"Task assegnati",leggi_ferie:"Ferie/permessi",leggi_review:"Performance review",leggi_skills:"Skill matrix",leggi_formazione:"Formazione",leggi_sicurezza:"Sicurezza lavoro",leggi_offboarding:"Offboarding",leggi_hr_analytics:"HR analytics"};
// chart group field + KPI builders per dominio
const CHART={vendite:["leggi_lead","status","Lead per stato"],finance:["leggi_conversioni","type","Conversioni per tipo"],operations:["leggi_task_operativi","status","Task per stato"],legal:["leggi_iscritti_newsletter","confirmed","Iscritti newsletter"],hr:["leggi_assegnatari","status","Task per stato"]};
const VLBL={"true":"Confermati","false":"Non confermati",done:"Completati",running:"In corso",pending:"In attesa",approved:"Approvati",rejected:"Rifiutati",todo:"Da fare",in_progress:"In corso",open:"Aperti",new:"Nuovi",won:"Vinti",lost:"Persi",qualified:"Qualificati",contacted:"Contattati",closed:"Chiusi",draft:"Bozza",active:"Attivi",paid:"Pagati"};
function vlabel(k){return VLBL[String(k).toLowerCase()]||String(k);}
let DOMAINS=[],VIEW="overview",CUR=null,charts=[],MK={};
function killCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];}
function arr(v){return Array.isArray(v)?v:[];}
function group(rows,field){const o={};arr(rows).forEach(r=>{let k=r[field];k=(k===true?"sì":k===false?"no":(k==null||k===""?"n/d":k));o[k]=(o[k]||0)+1;});return o;}
function donut(canvasId,labels,data){const el=$(canvasId);if(!el)return;const c=new Chart(el,{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:PAL,borderWidth:0}]},options:{cutout:"66%",plugins:{legend:{position:"right",labels:{boxWidth:8,font:{size:10}}}}}});charts.push(c);}

function buildNav(){
  const g=document.querySelector('[data-group="domains"]');
  g.innerHTML=DOMAINS.map(d=>{const m=META[d]||{ico:"•",label:d};return `<div class="navi" data-view="dom:${d}">${m.ico} ${esc(m.label)}</div>`;}).join("");
  document.querySelectorAll("#nav .navi").forEach(n=>n.onclick=()=>route(n.dataset.view));
}
function route(v){if(v==="soon"){alert("Sezione in arrivo.");return;}VIEW=v;CUR=v.startsWith("dom:")?v.slice(4):null;DTAB="Overview";load();}
function markNav(){document.querySelectorAll("#nav .navi").forEach(n=>n.classList.toggle("active",n.dataset.view===VIEW));}
function setHeader(title,sub,showRun){$("hd-title").textContent=title;$("hd-sub").textContent=sub;$("btn-run").classList.toggle("hidden",!showRun);}

function kpi(label,val,sub,accent){return `<div class="card lift p-4 fu"><div class="text-[12px] text-slate-400 font-semibold">${label}</div>
  <div class="text-2xl font-extrabold kpiv mt-1 ${accent||''}">${val}</div><div class="mt-1 ${sub&&sub.real?'real':'muted'}">${sub&&sub.t?esc(sub.t):(sub||'')}</div></div>`;}
// KPI premium con icona + sparkline
function mkpi(icon,label,val,sub,subcol,pts){return `<div class="card lift p-4 fu">
  <div class="flex items-center gap-2 mb-1"><span class="w-7 h-7 rounded-lg bg-blue-50 grid place-items-center text-[14px]">${icon}</span><span class="text-[12px] text-slate-400 font-semibold">${esc(label)}</span></div>
  <div class="flex items-end justify-between gap-2"><div class="text-[26px] font-extrabold kpiv leading-none">${val}</div><div class="opacity-90">${spark(pts||[5,6,6,7,8,8,9,10])}</div></div>
  <div class="mt-2 text-[11px] font-bold ${subcol||'text-slate-400'}">${sub||''}</div></div>`;}
// Agent Status con avatar robot + checklist + uptime
function agentStatusCard(checks,uptime){return `<div class="card p-4 fu"><div class="flex items-center justify-between mb-3"><div class="font-bold text-sm">Agent Status</div><span class="chip bg-emerald-50 text-emerald-700"><span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 align-middle"></span>active</span></div>
  <div class="flex gap-3 items-start"><ul class="space-y-1.5 text-[13px] flex-1">${checks.map(c=>`<li class="flex items-center gap-2"><span class="text-emerald-500">✓</span><span class="truncate">${esc(c)}</span></li>`).join("")}</ul>
  <div class="ava shrink-0" style="width:60px;height:60px">${robotSVG(true)}</div></div>
  ${uptime?`<div class="mt-3 pt-2 border-t border-slate-50 text-[12px] text-emerald-600 font-semibold">Uptime ${uptime}</div>`:""}</div>`;}
function quickActionsCard(items){return `<div class="card p-4 fu"><div class="font-bold text-sm mb-3">Quick Actions</div><div class="space-y-2 text-[13px]">${items.map(it=>`<button onclick="${it[1]}" class="w-full text-left btn-sec rounded-xl px-3 py-2 transition hover:border-blue-200 hover:bg-blue-50/50">${it[0]}</button>`).join("")}</div></div>`;}
function recoCard(deliv){const body=(deliv&&deliv.length)?deliv.slice(0,5).map(x=>`<div class="flex gap-2 items-start"><span class="text-blue-500 mt-0.5">◆</span><div><b class="text-[13px]">${esc(x.titolo||'')}</b><div class="text-[12px] text-slate-500">${esc((x.contenuto||'').slice(0,110))}</div></div></div>`).join("")
  :`<div class="text-[12px] text-slate-400">Nessun deliverable — una proposta per generarlo.</div><div class="mt-2 opacity-80">${spark([4,5,5,6,6,7,7,8])}</div>`;
  return `<div class="card p-4 fu"><div class="font-bold text-sm mb-3 flex items-center gap-2">AI Recommendations <span class="real">reale</span></div><div class="space-y-3">${body}</div></div>`;}
// Tabella decisioni premium (Approva / Modifica / Rifiuta)
function decTable(items,title,count){
  const rows=items.length?items.map((a,i)=>{const p=a.payload||{};const pr=PRIO[i%3];
    return `<tr class="arow border-t border-slate-100 align-top">
      <td class="py-3 pr-3"><span class="font-bold ${prioColor[pr]}">● ${pr}</span></td>
      <td class="py-3 pr-3 font-semibold max-w-[200px]">${esc(p.titolo||p.tipo||'Proposta')}</td>
      <td class="py-3 pr-3 text-slate-500 max-w-[320px]">${esc((p.contenuto||'').slice(0,150))}</td>
      <td class="py-3 pr-3 text-[12px] text-emerald-700 max-w-[170px]">${esc((p.motivo||'').slice(0,90))}</td>
      <td class="py-3 text-right whitespace-nowrap">
        <button class="approve btn-app text-[12px] font-semibold px-3 py-1.5 rounded-lg" data-id="${a.id}">Approva</button>
        <button class="edit btn-sec text-[12px] px-3 py-1.5 rounded-lg ml-1" data-id="${a.id}">Modifica</button>
        <button class="reject btn-sec text-[12px] text-red-600 px-3 py-1.5 rounded-lg ml-1" data-id="${a.id}">Rifiuta</button></td></tr>`;}).join("")
    :`<tr><td colspan="5" class="py-6 text-center text-slate-400">Nessuna decisione in attesa 🎉</td></tr>`;
  return `<section class="card p-5 fu"><div class="flex items-center gap-3 mb-4"><h3 class="sec-t">${title||'Decisioni da prendere'}</h3>
    <span class="chip bg-amber-100 text-amber-700">${count!=null?count:items.length} in attesa</span><span class="real">reale · kernel</span></div>
    <div class="overflow-x-auto"><table class="w-full text-[13px]"><thead><tr class="text-left text-slate-400 text-[11px] uppercase tracking-wide">
      <th class="py-2 pr-3">Priorità</th><th class="py-2 pr-3">Decisione</th><th class="py-2 pr-3">Descrizione</th><th class="py-2 pr-3">Impatto</th><th class="py-2 text-right">Azione</th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>`;}
function decisioniTable(items,title,showArea){
  const rows=items.length?items.map((a,i)=>{const p=a.payload||{};const pr=PRIO[i%3];
    return `<tr class="border-t border-slate-100 align-top">
      <td class="py-3 pr-3"><span class="font-bold ${prioColor[pr]}">● ${pr}</span></td>
      ${showArea?`<td class="py-3 pr-2"><span class="chip bg-slate-100 text-slate-500">${esc((a.action_key||"").split(".")[0])}</span></td>`:""}
      <td class="py-3 pr-3 font-semibold max-w-[210px]">${esc(p.titolo||p.tipo||"Proposta")}</td>
      <td class="py-3 pr-3 text-slate-500 max-w-[300px]">${esc((p.contenuto||"").slice(0,150))}</td>
      <td class="py-3 text-right whitespace-nowrap">
        <button class="approve bg-ok text-white text-[12px] font-semibold px-3 py-1.5 rounded-lg" data-id="${a.id}">Approva</button>
        <button class="reject border border-slate-200 text-red-600 text-[12px] px-3 py-1.5 rounded-lg ml-1" data-id="${a.id}">Rifiuta</button>
      </td></tr>`;}).join("")
    :`<tr><td colspan="${showArea?5:4}" class="py-6 text-center text-slate-400">Nessuna decisione in attesa 🎉</td></tr>`;
  return `<section class="card p-5"><div class="flex items-center gap-3 mb-4"><h3 class="sec-t">${title||"Decisioni da prendere"}</h3>
    <span class="chip bg-amber-100 text-amber-700">${items.length} in attesa</span><span class="real">reale · kernel</span></div>
    <div class="overflow-x-auto"><table class="w-full text-[13px]"><thead><tr class="text-left text-slate-400 text-[11px] uppercase tracking-wide">

function spark(pts,color){color=color||"#2563EB";const W=92,H=30,mn=Math.min(...pts),mx=Math.max(...pts),st=W/(pts.length-1);
  const xy=pts.map((v,i)=>[i*st,H-3-((v-mn)/((mx-mn)||1))*(H-7)]);
  const d="M"+xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L");
  const id="g"+Math.floor(xy[0][1]*100+pts.length);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="spark" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".16"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${W},${H} L0,${H} Z" fill="url(#${id})"/><path class="l" d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function donutSVG(pct){const r=54,c=2*Math.PI*r,o=c*(1-pct/100);
  return `<svg width="150" height="150" viewBox="0 0 128 128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="#E6EAF2" stroke-width="13"/>
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="#2563EB" stroke-width="13" stroke-linecap="round" transform="rotate(-90 64 64)" style="--o:${o.toFixed(1)};stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${c.toFixed(1)};animation:ringfill 1.4s cubic-bezier(.2,.7,.2,1) .25s forwards"/></svg>`;}

      <section class="card lift p-5 fu"><div class="font-bold text-sm mb-3 flex items-center gap-2">Engagement per post <span class="real">reale</span></div>
      <table class="w-full text-[12px]"><thead><tr class="text-left text-slate-400 text-[11px] uppercase"><th class="py-1">Post</th><th class="text-right">Like</th><th class="text-right">Commenti</th></tr></thead>
      <tbody>${posts.length?posts.map(p=>`<tr class="arow border-t border-slate-50"><td class="py-2">${esc((p.caption||'(senza testo)').slice(0,50))}</td><td class="text-right">${NUM(p.like_count)}</td><td class="text-right">${NUM(p.comments_count)}</td></tr>`).join(""):'<tr><td colspan="3" class="py-4 text-center text-slate-400">nessun post</td></tr>'}</tbody></table></section>`;
  }
  else if(MK.tab==="SEO"){
    const t=MK.topics,byP={};t.forEach(x=>{const k=x.Pillar||"Altro";(byP[k]=byP[k]||[]).push(x);});
    const cols=Object.keys(byP).map(k=>`<div class="card lift p-4 fu"><div class="font-bold text-sm mb-2 flex items-center justify-between">${esc(k)} <span class="chip bg-slate-100 text-slate-500">${byP[k].length}</span></div><ul class="text-[12px] space-y-1">${byP[k].map(x=>`<li class="border-t border-slate-50 pt-1.5 mt-1">${esc(x.Tema||'')}</li>`).join("")}</ul></div>`).join("");
    c.innerHTML=`<section class="card p-4 fu text-[13px] text-slate-500">Cluster keyword/temi reali da <code>topics</code> (${t.length}) per pillar. Search Console/Ahrefs non collegati → solo strategia cluster.</section>
      <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${cols||'<div class="text-slate-400">nessun topic</div>'}</section>`;
  }
}

// ---------------- DOCUMENTS / ANALYTICS ----------------
async function loadDocuments(){
  setHeader("Documents","documenti delle commesse (project_documents)",false);markNav();killCharts();
  let v={};try{v=await jget("/api/domain/operations");}catch(e){}
  const docs=arr((v.data||{}).leggi_documenti);
  const rows=docs.length?docs.map(d=>`<tr class="border-t border-slate-50"><td class="py-2 font-semibold">${esc(d.filename||'')}</td><td class="py-2 text-slate-500">${esc(d.source||'')}</td><td class="py-2 text-slate-400 text-[12px]">${esc((d.created_at||'').slice(0,10))}</td></tr>`).join(""):'<tr><td colspan="3" class="py-4 text-center text-slate-400">nessun documento</td></tr>';
  $("view").innerHTML=`<section class="card p-5"><div class="flex items-center gap-3 mb-3"><h3 class="sec-t">Documents</h3><span class="real">reale · project_documents</span></div>
    <table class="w-full text-[13px]"><thead><tr class="text-left text-slate-400 text-[11px] uppercase"><th class="py-1">File</th><th class="py-1">Origine</th><th class="py-1">Data</th></tr></thead><tbody>${rows}</tbody></table></section>`;
}
async function loadAnalytics(){
  setHeader("Analytics","snapshot e funnel K-BOT",false);markNav();killCharts();
  let ov={};try{ov=await jget("/api/overview");}catch(e){}
  $("view").innerHTML=`<section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    ${kpi("Eventi audit",NUM(ov.audit_count),{t:"reale",real:1})}${kpi("Automazioni",NUM(ov.automations_done),{t:"reale",real:1})}
    ${kpi("Agenti",DOMAINS.length,{t:"reali",real:1})}${kpi("Snapshot analytics","—","tabella analytics_snapshots")}</section>
    <section class="card p-6 text-slate-500 text-sm">Vista analytics avanzata (trend storici da <code>analytics_snapshots</code>) in arrivo. I numeri operativi reali sono nei singoli reparti.</section>`;
}

async function loadSettings(){
  setHeader("Settings","integrazioni e credenziali — l'unica cosa che manca per andare full",false);markNav();killCharts();
  let items=[];try{items=await jget("/api/integrations");}catch(e){}
  const conn=items.filter(i=>i.connesso).length;
  const card=i=>`<tr class="border-t border-slate-50"><td class="py-2 font-semibold">${esc(i.nome)}</td>
    <td class="py-2"><span class="chip ${i.tipo==='core'?'bg-slate-100 text-slate-500':'bg-blue-50 text-blue-700'}">${esc(i.tipo)}</span></td>
    <td class="py-2">${i.connesso?'<span class="chip bg-emerald-100 text-emerald-700">● connesso</span>':'<span class="chip bg-amber-100 text-amber-700">○ manca credenziale</span>'}</td>
    <td class="py-2 text-slate-400 text-[11px]">${esc((i.env||[]).join(', '))}</td></tr>`;
  $("view").innerHTML=`<section class="grid grid-cols-2 lg:grid-cols-3 gap-3">
    ${kpi("Integrazioni connesse",conn+"/"+items.length,{t:"reale",real:1})}
    ${kpi("Da collegare",items.length-conn,"servono solo le credenziali")}
    ${kpi("Autonomia agenti","L1",{t:"propone, tu approvi",real:1})}</section>
    <section class="card p-5"><div class="flex items-center gap-3 mb-3"><h3 class="sec-t">Integrazioni</h3><span class="real">reale · env</span></div>
    <p class="text-[12px] text-slate-500 mb-3">Tutto il codice è già pronto. Dove vedi "manca credenziale", basta aggiungere la chiave nel file <code>.env</code> e l'agente inizia a leggere i dati veri — nessun'altra modifica.</p>
    <div class="overflow-x-auto"><table class="w-full text-[13px]"><thead><tr class="text-left text-slate-400 text-[11px] uppercase"><th class="py-1">Servizio</th><th>Tipo</th><th>Stato</th><th>Variabili env</th></tr></thead>
    <tbody>${items.map(card).join("")||'<tr><td colspan="4" class="py-4 text-center text-slate-400">—</td></tr>'}</tbody></table></div></section>`;
}
async function load(){
  if(VIEW==="overview")return loadOverview();
  if(VIEW==="agents")return loadAgents();
  if(VIEW==="documents")return loadDocuments();
  if(VIEW==="analytics")return loadAnalytics();
  if(VIEW==="settings")return loadSettings();
  if(VIEW&&VIEW.startsWith("dom:"))return loadDomain();
  return loadOverview();
}
async function runAgent(){
  if(!CUR){alert("Apri un reparto per far girare il suo agente.");return;}
  const btn=$("btn-run"),old=btn.textContent;btn.textContent="⏳ sto girando…";btn.disabled=true;
  try{const r=await jpost(`/api/agents/${CUR}/run`,{});alert(`Agente ${CUR}: ${r.proposte||0} proposte`+(r.calendario?`, ${r.calendario} voci calendario`:""));}
  catch(e){alert("errore");}
  btn.textContent=old;btn.disabled=false;load();
}
(async()=>{try{const d=await jget("/api/domini");DOMAINS=d.domini||[];}catch(e){DOMAINS=["marketing"];}buildNav();load();})();
</script>
