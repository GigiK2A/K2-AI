# Railway deploy per K2-AI AIOS (cockpit + autonomia, Python).
# Imposta il "Root Directory" del servizio Railway su `aios`; build via Nixpacks
# (rileva pyproject.toml). PORT lo inietta Railway; imposta AIOS_HOST=0.0.0.0 e
# AIOS_API_TOKEN nelle Variables. Per l'autonomia: AIOS_AUTONOMY=1 (single-service)
# oppure un secondo servizio con startCommand "python autonomy_loop.py".
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python serve_cockpit.py"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
